name: Build OK APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    steps:
      - name: 拉取源码
        uses: actions/checkout@v4

      - name: 配置 JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - name: 配置 Python 3.8（Chaquopy 需要）
        uses: actions/setup-python@v5
        with:
          python-version: '3.8'

      - name: 接受 Android SDK 许可证
        run: |
          SDKMANAGER=$(command -v sdkmanager || echo "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager")
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true

      - name: 拉取 Media3 源码
        run: |
          git init media
          git -C media remote add origin https://github.com/FongMi/media.git
          git -C media fetch --depth 1 origin 1ec193883c9861c816c660181692c43c4c9b67b8
          git -C media checkout FETCH_HEAD

      - name: 配置 Release 签名
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "未配置签名 secrets，将回退到 debug 签名"
            exit 0
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/ok-release.jks"
          touch local.properties
          {
            echo "storeFile=$RUNNER_TEMP/ok-release.jks"
            echo "keyAlias=$KEY_ALIAS"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyPassword=$KEY_PASSWORD"
          } >> local.properties

      - name: 配置 Gradle 缓存
        uses: gradle/actions/setup-gradle@v4

      - name: 编译 Release APK
        run: |
          chmod +x gradlew
          ./gradlew \
            assembleLeanbackJavaArm64_v8aRelease \
            assembleLeanbackJavaArmeabi_v7aRelease \
            assembleMobileJavaArm64_v8aRelease \
            assembleMobileJavaArmeabi_v7aRelease \
            --no-daemon --stacktrace

      - name: 查看生成的 APK
        run: find app/build/outputs/apk -name "*.apk"

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: OK-0118-${{ github.sha }}
          path: app/build/outputs/apk/**/*.apk
          retention-days: 30

      - name: 发布 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0118-build-${{ github.run_number }}
          name: OK影视 0118 自动构建 #${{ github.run_number }}
          body: |
            由 GitHub Actions 自动构建。

            提交：${{ github.sha }}
            分支：${{ github.ref_name }}

            包含：
            - Leanback ARM64 / ARMv7
            - Mobile ARM64 / ARMv7
          files: |
            app/build/outputs/apk/**/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
